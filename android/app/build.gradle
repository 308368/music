apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

def webAssets = layout.buildDirectory.dir('generated/assets/web')
def phonePlayerMarkup = file('src/main/phone-player.html')
def syncWebAssets = tasks.register('syncWebAssets', Sync) {
    inputs.file(project.buildFile)
    inputs.file(phonePlayerMarkup)
    from(rootProject.file('../web'))
    into(webAssets)
    filteringCharset = 'UTF-8'
    filesMatching('index.html') {
        def skipDesktopPlayer = false
        filter { line ->
            if (skipDesktopPlayer) {
                if (line == '  </section>') skipDesktopPlayer = false
                return null
            }
            if (line.startsWith('  <section class="now-playing"')) {
                skipDesktopPlayer = true
                return phonePlayerMarkup.getText('UTF-8').stripTrailing()
            }
            line.replace('<script src="js/player.js"></script>',
                '<script src="native-audio.js"></script><script src="phone-player.js"></script><script src="js/player.js"></script>')
                .replace('<script src="js/app.js"></script>',
                    '<script src="js/app.js"></script><script src="mini-player.js"></script><script src="phone-home.js"></script><script src="phone-search.js"></script>')
                .replace('<link rel="stylesheet" href="css/app.css">',
                    '<link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="mini-player.css"><link rel="stylesheet" href="phone-ui.css"><link rel="stylesheet" href="phone-turntable.css"><link rel="stylesheet" href="phone-search.css">')
                .replace('<path class="fill" d="m8 5 11 7-11 7Z"/>', '<path fill="currentColor" stroke="none" d="m8 5 11 7-11 7Z"/>')
                .replace('content="#0b0b0f"', 'content="#080e14"')
                .replace('<span class="pt" id="pTitle">未播放</span><span class="ps" id="pSub"></span>',
                    '<span class="pt mini-line"><span class="mini-track"><span id="pTitle">未播放</span></span></span><span class="ps mini-line"><span class="mini-track"><span id="pSub"></span></span></span>')
                .replace('<symbol id="i-home"',
                    '<symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 12h3l2-5 3 11 4-14 3 12 2-4h3"/></symbol><symbol id="i-network" viewBox="0 0 24 24"><path d="M3 9a14 14 0 0 1 18 0M6 13a9 9 0 0 1 12 0m-9 4a4.5 4.5 0 0 1 6 0m-3 4h.01"/></symbol><symbol id="i-home"')
                .replace('<h1 class="title">汽水音乐</h1><span class="status-dot" title="服务状态" aria-hidden="true"></span>',
                    '<h1 class="title"><svg class="icon" aria-hidden="true"><use href="#i-wave"/></svg>汽水音乐</h1><a class="network-link" href="/network-settings"><svg class="icon" aria-hidden="true"><use href="#i-network"/></svg>网络设置</a>')
                .replace('<label class="search-shell"',
                    '<h2 class="page-title" id="searchTitle" hidden>搜索</h2><label class="search-shell"')
        }
    }
    filesMatching('js/api.js') {
        filter { line ->
            line.replace('const params = new URLSearchParams({', 'const params = new URLSearchParams({ id: song?.id || "",')
                .replace('    BASE,', '    BASE, searchTyped: (params, options) => get("/api/search?" + new URLSearchParams(params), options), playlistDetail: (params, options) => get("/api/playlist-detail?" + new URLSearchParams(params), options),')
                .replace('无法连接服务，请确认后端已启动', '无法连接音源，请检查手机网络设置')
                .replace('get(`/api/playlist?n=${n}`, { timeout: 120000, ...options })',
                    'get(`/api/playlist?n=${n}${options?.refresh ? "&refresh=1" : ""}`, { timeout: 120000, ...options })')
        }
    }
    filesMatching('js/app.js') {
        filter { line ->
            line.replace('<span class="s">${esc(song.channel || "未知歌手")}</span>',
                '<span class="s">${esc([song.channel || "未知歌手", song.album].filter(Boolean).join(" · "))}</span>')
                .replace('$(".topbar .title").textContent = ({ home: "汽水音乐", search: "搜索", profile: "我的音乐" })[view];', '')
                .replace('$("#searchShell").hidden =', '$("#searchTitle").hidden = $("#searchShell").hidden =')
                .replace('  loadHome();', '  loadPhoneHome();')
                .replace('$("#searchInput").addEventListener("input", (event) => onSearchInput(event.target.value));', 'initPhoneSearch();')
                .replace('API.health().then(() => $(".status-dot").classList.add("online")).catch(() => {});', '')
                .replace('<div class="profile-head"><span class="avatar">${icon("music")}</span><div><strong>本地音乐库</strong><span>收藏 ${favs.length} · 最近播放 ${historyItems.length}</span></div></div>', '<h2 class="page-title">我的音乐</h2>')
                .replace('播放过的歌曲会出现在这里")}', '播放过的歌曲会出现在这里")}<a class="music-source-link" href="/music-source">关于与音源<span>Neko歌姬计划 API</span></a>')
        }
    }
}

android {
    namespace 'local.douyin.music'
    compileSdk 35

    defaultConfig {
        applicationId 'local.douyin.music'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '3.6'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }

    sourceSets.main.assets.srcDir(webAssets)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
        buildPython 'python'
        pip {
            install '-r', project.file('requirements.txt').absolutePath
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(syncWebAssets)
}
